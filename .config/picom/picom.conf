#################################
#        General / Backend      #
#################################

# Use ‘xrender’ for maximum compatibility or ‘glx’ for better performance (try
# both; glx may provide smoother playback, but it can cause artifacts on Ivy
# Bridge)
backend = "xrender";
# backend = "glx";

vsync = true;                     # Prevent screen tearing
use-damage = true;                # Reduce CPU/GPU usage
mark-wmwin-focused = true;        # Select windows focused by WM
mark-ovredir-focused = true;      # Redirect Support
detect-rounded-corners = true;    # Detect rounded edges
detect-client-opacity = true;     # Respect the opacity set by the app
detect-transient = true;          # Detect transient windows
detect-client-leader = true;      # Detect window handle
log-level = "warn";               # Important notices only

#################################
#          Shadow               #
#################################

# shadow = true;
# shadow-radius = 8;
# shadow-opacity = 0.6;
# shadow-offset-x = -4;
# shadow-offset-y = -4;
# shadow-red = 0.0;
# shadow-green = 0.0;
# shadow-blue = 0.0;

# Remove shadows from specific windows
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'menu'",
  "class_i = 'dmenu'",
  "class_i = 'rofi'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Do not apply shadows on docks and DnD
no-dock-shadow = true;
no-dnd-shadow = true;

#################################
#          Fading               #
#################################

fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;
fade-delta = 10;
# no-fading-openclose = false; # (optional) Turn this off if you want a fade effect when opening/closing
# no-fading-destroyed-argb = false;

#################################
#    Opacity (Transparency)     #
#################################

inactive-opacity = 1.0;            # Inactive windows become slightly transparent
frame-opacity = 1.0;               # Borders with no transparency
inactive-opacity-override = false; # Complies with rule-based opacity
active-opacity = 1.0;              # Active window 100% opaque
inactive-dim = 0.0;                # Does not dim inactive windows

# Rules for forcing opacity (uncomment and adjust as needed for your apps)
# opacity-rule = [
#   "100:class_g = 'TelegramDesktop'",
#   "100:class_g = 'Telegram'",
#   "100:name *= 'Telegram'",
#   "100:name *= 'Visualizador de Mídia'",
#   "100:class_g = 'mpv'",
#   "100:class_g = 'vlc'"
# ];

#################################
#            Blur               #
#################################

# Blur is too demanding for this GPU; keep it turned off.
# blur-method = "dual_kawase";
# blur-size = 8;
# blur-strength = 6;
# blur-background = false;
# blur-background-frame = false;
# blur-background-fixed = false;

#################################
#       Window Types            #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; fade = false; };
  menubar = { shadow = false; fade = false; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; fade = false; };
  dropdown_menu = { shadow = false; fade = false; };
  utility = { shadow = false; fade = true; }; # functional windows
  splash = { shadow = false; fade = true; };  # splash screens
};

######################################
# Additional Performance Adjustments #
######################################

# unredir-if-possible = true;      # (optional) frees up the GPU in full-screen mode
# unredir-if-possible-delay = 0;
# xrender-sync-fence = false;      # (only for xrender) may cause instability
# glx-no-stencil = true;           # (glx only) disables stencil for performance
# glx-no-rebind-pixmap = true;     # (glx only) reduces overhead
