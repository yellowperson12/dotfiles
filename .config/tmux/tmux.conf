# Setting the delay between prefix and command
set -s escape-time 0

# Set the base index for windows/panes to 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Alt-</>
bind -n M-< previous-window
bind -n M-> next-window

# Toggle status bar
bind -n M-space set-option -g status

# Enable mouse support
set -g mouse on

# Enable vi mode buffer
setw -g mode-keys vi

# Set window title
set -g set-titles on
set -g set-titles-string '#{b:pane_current_path}'
# set -g set-titles-string '#{pane_title}'

# Set window name
set -g automatic-rename on

# Renumber windows
set -g renumber-windows on

# Reload settings
bind R source-file ~/.tmux.conf \; display-message "Settings reloaded!"

# Splitting panes with v and h
bind h split-window -h
bind v split-window -v
unbind %
unbind '"'

# Open new panes/windows in current path
bind H split-window -h -c '#{pane_current_path}'
bind V split-window -v -c '#{pane_current_path}'
bind C new-window -c '#{pane_current_path}'

# set-option -g focus-events on
set -g focus-events on

# APPEARANCE...
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'
