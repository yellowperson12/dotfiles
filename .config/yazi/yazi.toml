[mgr]
sort_by = "natural"
sort_sensitive = true
sort_dir_first = true
sort_translit = true
show_hidden = true
show_symlink = true

[preview]
wrap = "yes"

[opener]
sistema = [
    { run = 'xdg-open "$@"', desc = "Abrir com o Sistema (xdg-open)", orphan = true }
]

[open]
rules = [
	{ mime = "*", use = [ "sistema", "reveal", "edit" ] }
]
